{% extends "base.html" %}

{% block head %}
<script>
    // Global state
    let generators = [];
    let utilities = [];
    let platforms = [];
    let tasks = [];
    let filteredTasks = [];
    const filterState = {
        search: '',
        status: [],
        platform: [],
        dateRange: {
            start: '',
            end: ''
        }
    };

    // =========================================
    // Utility Functions for Drag & Drop Ordering
    // =========================================
    function getClosestItem(container, y) {
        const items = [...container.querySelectorAll('.selected-utility')];
        return items.reduce((closest, item) => {
            const box = item.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (closest === null || Math.abs(offset) < Math.abs(closest.offset)) {
                return { offset, element: item };
            } else {
                return closest;
            }
        }, null)?.element;
    }

    function updateOrderNumbers() {
        const selectedItems = document.querySelectorAll('#selected-utilities .selected-utility');
        selectedItems.forEach((item, index) => {
            const orderSpan = item.querySelector('.text-gray-400');
            if (orderSpan) {
                orderSpan.textContent = `Order: ${index + 1}`;
            }
        });
    }

    function handleUtilitySelection(checkbox, utilId, utilName) {
        const selectedDiv = document.getElementById('selected-utilities');
        
        if (checkbox.checked) {
            // Add to selected utilities
            const selectedItem = document.createElement('div');
            selectedItem.className = 'selected-utility';
            selectedItem.setAttribute('data-id', utilId);
            selectedItem.draggable = true;
            selectedItem.innerHTML = `
                <div class="flex items-center p-3 bg-gray-700 rounded-lg border border-primary-500">
                    <span class="ml-2 text-sm flex-1">
                        <i class="fas fa-puzzle-piece text-primary-500 mr-2"></i>
                        ${utilName}
                    </span>
                    <span class="text-xs text-gray-400 mr-2">Order: ${selectedDiv.children.length + 1}</span>
                    <i class="fas fa-grip-vertical text-gray-500 cursor-move"></i>
                </div>
            `;
            selectedDiv.appendChild(selectedItem);
        } else {
            // Remove from selected utilities
            const selectedItem = selectedDiv.querySelector(`[data-id="${utilId}"]`);
            if (selectedItem) {
                selectedItem.remove();
            }
            updateOrderNumbers();
        }
    }

    function initializeDragAndDrop() {
        const selectedDiv = document.getElementById('selected-utilities');
        let draggedItem = null;

        document.addEventListener('dragstart', (e) => {
            if (e.target.classList.contains('selected-utility')) {
                draggedItem = e.target;
                e.target.classList.add('dragging');
            }
        });

        document.addEventListener('dragend', (e) => {
            if (e.target.classList.contains('selected-utility')) {
                e.target.classList.remove('dragging');
                // Remove any leftover drag-over classes
                document.querySelectorAll('.drag-over').forEach(el => {
                    el.classList.remove('drag-over');
                });
            }
        });

        document.addEventListener('dragover', (e) => {
            e.preventDefault();
            if (draggedItem) {
                // Remove drag-over class from all items
                document.querySelectorAll('.drag-over').forEach(el => {
                    el.classList.remove('drag-over');
                });

                const closestItem = getClosestItem(selectedDiv, e.clientY);
                if (closestItem && closestItem !== draggedItem) {
                    closestItem.classList.add('drag-over');
                }
            }
        });

        selectedDiv.addEventListener('drop', (e) => {
            e.preventDefault();
            if (draggedItem) {
                const closestItem = getClosestItem(selectedDiv, e.clientY);
                if (closestItem) {
                    const rect = closestItem.getBoundingClientRect();
                    const midpoint = rect.top + rect.height / 2;
                    if (e.clientY < midpoint) {
                        selectedDiv.insertBefore(draggedItem, closestItem);
                    } else {
                        selectedDiv.insertBefore(draggedItem, closestItem.nextSibling);
                    }
                }
                updateOrderNumbers();
                // Remove any leftover drag-over classes
                document.querySelectorAll('.drag-over').forEach(el => {
                    el.classList.remove('drag-over');
                });
            }
        });
    }

    // =====================================
    // UI Update Functions
    // =====================================
    function setLoading(isLoading) {
        const loadingOverlay = document.getElementById('loading-overlay');
        if (isLoading) {
            loadingOverlay.classList.remove('hidden');
        } else {
            loadingOverlay.classList.add('hidden');
        }
    }

    function updateGeneratorSelect() {
        const select = document.getElementById('generator_id');
        select.innerHTML = '<option value="">Select a Generator...</option>' + 
            generators.map(gen => 
                `<option value="${gen.id}">${gen.name}</option>`
            ).join('');
    }

    function updateUtilitiesCheckboxes() {
        const utilDiv = document.getElementById('utilities');
        utilDiv.innerHTML = utilities.map(util => `
            <div class="utility-item" draggable="true" data-id="${util.id}">
                <label class="flex items-center p-3 bg-gray-800 rounded-lg border border-gray-700 hover:border-primary-500 transition-colors cursor-pointer">
                    <input type="checkbox" id="utility_${util.id}" name="utilities" value="${util.id}"
                        class="w-4 h-4 text-primary-500 focus:ring-primary-500 rounded"
                        onchange="handleUtilitySelection(this, ${util.id}, '${util.name}')">
                    <span class="ml-2 text-sm flex-1">
                        <i class="fas fa-puzzle-piece text-primary-500 mr-2"></i>
                        ${util.name}
                    </span>
                    <i class="fas fa-grip-vertical text-gray-500 ml-2 cursor-move"></i>
                </label>
            </div>
        `).join('');

        initializeDragAndDrop();
    }

    function updatePlatformsCheckboxes() {
        const platDiv = document.getElementById('platforms');
        platDiv.innerHTML = platforms.map(plat => `
            <label class="flex items-center p-3 bg-gray-800 rounded-lg border border-gray-700 hover:border-primary-500 transition-colors cursor-pointer">
                <input type="checkbox" id="platform_${plat.id}" name="platforms" value="${plat.id}"
                    class="w-4 h-4 text-primary-500 focus:ring-primary-500 rounded">
                <span class="ml-2 text-sm">
                    <i class="fas fa-share-alt text-primary-500 mr-2"></i>
                    ${plat.platform} - ${plat.account_name}
                </span>
            </label>
        `).join('');
    }

    function renderTasks() {
        const tbody = document.getElementById('tasksBody');
        if (filteredTasks.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="8" class="px-6 py-12 text-center text-gray-500">
                        <i class="fas fa-tasks text-4xl mb-3"></i>
                        <p class="text-lg font-medium">No tasks found</p>
                        <p class="text-sm">Try adjusting your filters or create a new task.</p>
                    </td>
                </tr>
            `;
            return;
        }

        tbody.innerHTML = filteredTasks.map(task => {
            const platformNames = task.platforms
                .map(id => platforms.find(p => p.id === id)?.platform || 'Unknown')
                .join(', ');
            
            const statusColors = {
                'PENDING': 'bg-yellow-900 text-yellow-300',
                'COMPLETED': 'bg-green-900 text-green-300',
                'FAILED': 'bg-red-900 text-red-300',
                'RUNNING': 'bg-blue-900 text-blue-300'
            };
            
            return `
                <tr class="bg-gray-800 border-b border-gray-700 hover:bg-gray-700 transition-colors">
                    <td class="px-6 py-4 whitespace-nowrap font-medium">${task.name}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-gray-300">${task.id}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center">
                            <i class="fas fa-robot text-primary-500 mr-2"></i>
                            ${task.generator_name}
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex flex-wrap gap-1">
                            ${task.utilities.map(u => `
                                <span class="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium bg-gray-700">
                                    <i class="fas fa-puzzle-piece text-primary-500 mr-1"></i>
                                    ${u.name}
                                </span>
                            `).join('')}
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center">
                            <i class="fas fa-clock text-primary-500 mr-2"></i>
                            ${task.schedule}
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex flex-wrap gap-1">
                            ${platformNames.split(', ').map(platform => `
                                <span class="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium bg-gray-700">
                                    <i class="fas fa-share-alt text-primary-500 mr-1"></i>
                                    ${platform}
                                </span>
                            `).join('')}
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium ${statusColors[task.status]}">
                            ${task.status === 'RUNNING' ? `
                                <svg class="animate-spin h-3 w-3 mr-1" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                            ` : ''}
                            ${task.status}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex gap-2">
                            <button onclick="runTask(${task.id})" 
                                class="inline-flex items-center px-3 py-1 bg-green-600 hover:bg-green-700 text-white rounded-md text-xs transition-colors"
                                data-tooltip="Run task now">
                                <i class="fas fa-play mr-1"></i>
                                Run
                            </button>
							<button onclick="previewTask(${task.id})"
								class="inline-flex items-center px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded-md text-xs transition-colors"
								data-tooltip="Preview task output">
								<i class="fas fa-eye mr-1"></i>
								Preview
							</button>
							<button onclick="dryRunTask(${task.id})"
								class="inline-flex items-center px-3 py-1 bg-purple-600 hover:bg-purple-700 text-white rounded-md text-xs transition-colors"
								data-tooltip="Test without uploading">
								<i class="fas fa-vial mr-1"></i>
								Dry Run
							</button>
                            <button onclick="deleteTask(${task.id})"
                                class="inline-flex items-center px-3 py-1 bg-red-600 hover:bg-red-700 text-white rounded-md text-xs transition-colors"
                                data-tooltip="Delete task">
                                <i class="fas fa-trash mr-1"></i>
                                Delete
                            </button>
                        </div>
                    </td>
                </tr>
            `;
        }).join('');
    }

    // =====================================
    // Filter Functions
    // =====================================
    function initializeFilters() {
        // Add status filters
        const statuses = ['PENDING', 'RUNNING', 'COMPLETED', 'FAILED'];
        const statusFilters = document.getElementById('status-filters');
        statusFilters.innerHTML = statuses.map(status => `
            <label class="inline-flex items-center p-2 bg-gray-800 rounded-lg border border-gray-700 hover:border-primary-500 transition-colors cursor-pointer">
                <input type="checkbox" value="${status}" 
                    class="w-4 h-4 text-primary-500 focus:ring-primary-500 rounded"
                    onchange="updateFilters()">
                <span class="ml-2 text-sm">${status}</span>
            </label>
        `).join('');

        // Add platform filters
        const platformFilters = document.getElementById('platform-filters');
        platformFilters.innerHTML = platforms.map(platform => `
            <label class="inline-flex items-center p-2 bg-gray-800 rounded-lg border border-gray-700 hover:border-primary-500 transition-colors cursor-pointer">
                <input type="checkbox" value="${platform.id}" 
                    class="w-4 h-4 text-primary-500 focus:ring-primary-500 rounded"
                    onchange="updateFilters()">
                <span class="ml-2 text-sm">${platform.platform}</span>
            </label>
        `).join('');
    }
	function updateFilters() {
		filterState.search = document.getElementById('task-search').value.toLowerCase();
		filterState.status = Array.from(document.querySelectorAll('#status-filters input:checked')).map(cb => cb.value);
		filterState.platform = Array.from(document.querySelectorAll('#platform-filters input:checked')).map(cb => cb.value);
		filterState.dateRange.start = document.getElementById('date-start').value;
		filterState.dateRange.end = document.getElementById('date-end').value;
		filteredTasks = tasks.filter(task => {
            const matchesSearch = task.name.toLowerCase().includes(filterState.search);
            const matchesStatus = filterState.status.length === 0 || filterState.status.includes(task.status);
            const matchesPlatform = filterState.platform.length === 0 || 
                task.platforms.some(p => filterState.platform.includes(p.toString()));
            
            let matchesDate = true;
            if (filterState.dateRange.start || filterState.dateRange.end) {
                const taskDate = new Date(task.created_at);
                if (filterState.dateRange.start) {
                    matchesDate = matchesDate && taskDate >= new Date(filterState.dateRange.start);
                }
                if (filterState.dateRange.end) {
                    matchesDate = matchesDate && taskDate <= new Date(filterState.dateRange.end);
                }
            }

            return matchesSearch && matchesStatus && matchesPlatform && matchesDate;
        });

        renderTasks();
    }

    // =====================================
    // Task Action Functions
    // =====================================
    async function createTask(event) {
        event.preventDefault();
        if (!validateForm(event.target)) return;

        const submitButton = event.target.querySelector('button[type="submit"]');
        setButtonLoading(submitButton, true);

        // Get utilities in their displayed order
        const selectedUtilities = Array.from(document.querySelectorAll('#selected-utilities .selected-utility'))
            .map(item => parseInt(item.dataset.id));

        const formData = {
            name: document.getElementById('task_name').value,
            generator_id: parseInt(document.getElementById('generator_id').value),
            utilities: selectedUtilities, // This will now be in the correct order
            schedule: document.getElementById('schedule').value,
            platforms: Array.from(document.querySelectorAll('input[name="platforms"]:checked'))
                .map(checkbox => parseInt(checkbox.value)),
            hashtags: document.getElementById('hashtags').value,
            sound_name: document.getElementById('sound_name').value,
            sound_volume: document.getElementById('sound_volume').value,
            email_notify: document.getElementById('email_notify').value
        };

        try {
            const response = await fetch('/api/tasks', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(formData)
            });

            if (!response.ok) {
                throw new Error('Failed to create task');
            }

            showToast('Task created successfully!', 'success');
            event.target.reset();
            await loadData();
        } catch (error) {
            showToast('Error creating task: ' + error.message, 'error');
        } finally {
            setButtonLoading(submitButton, false);
        }
    }

    async function runTask(id) {
        try {
            const response = await fetch(`/api/tasks/${id}/run`, {
                method: 'POST'
            });
            const result = await response.json();
            showToast(result.message, 'success');
            await loadData();
        } catch (error) {
            showToast('Error running task: ' + error.message, 'error');
        }
    }

    async function deleteTask(id) {
        if (!confirm('Are you sure you want to delete this task?')) return;
        
        try {
            await fetch(`/api/tasks/${id}`, {
                method: 'DELETE'
            });
            showToast('Task deleted successfully', 'success');
            await loadData();
        } catch (error) {
            showToast('Error deleting task: ' + error.message, 'error');
        }
    }
	
	async function previewTask(id) {
	try {
		const response = await fetch(`/api/tasks/${id}/preview`, {
			method: 'POST'
		});
		
		if (response.ok) {
			// Get the video as a blob and create a temporary URL
			const blob = await response.blob();
			const url = window.URL.createObjectURL(blob);
			
			// Open the video in a new tab
			window.open(url, '_blank');
		} else {
			const error = await response.json();
			throw new Error(error.message || 'Preview failed');
		}
	} catch (error) {
		showToast('Error previewing task: ' + error.message, 'error');
	}
}

async function dryRunTask(id) {
	try {
		const response = await fetch(`/api/tasks/${id}/dry-run`, {
			method: 'POST'
		});
		const result = await response.json();
		showToast(result.message, result.success ? 'success' : 'error');
	} catch (error) {
		showToast('Error during dry run: ' + error.message, 'error');
	}
}

    // =====================================
    // Data Loading
    // =====================================
    async function loadData() {
        try {
            setLoading(true);
            const [generatorsRes, utilitiesRes, platformsRes, tasksRes] = await Promise.all([
                fetch('/api/generators'),
                fetch('/api/utilities'),
                fetch('/api/platforms'),
                fetch('/api/tasks')
            ]);

            generators = await generatorsRes.json();
            utilities = await utilitiesRes.json();
            platforms = await platformsRes.json();
            tasks = await tasksRes.json();
            filteredTasks = [...tasks]; // Initialize filtered tasks

            updateGeneratorSelect();
            updateUtilitiesCheckboxes();
            updatePlatformsCheckboxes();
            renderTasks();
            initializeFilters(); // Initialize the filter UI
        } catch (error) {
            showToast('Error loading data', 'error');
        } finally {
            setLoading(false);
        }
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', loadData);

    // Refresh tasks every 60 seconds
    setInterval(loadData, 60000);
</script>

{% endblock %}`
}

{% block content %}
<!-- Loading Overlay -->
<div id="loading-overlay" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 backdrop-blur-sm z-50 flex items-center justify-center">
    <div class="text-center">
        <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-primary-500 border-t-transparent"></div>
        <p class="mt-2 text-gray-300">Loading...</p>
    </div>
</div>

<!-- Task Creation Form -->
<div class="bg-gray-800 rounded-xl border border-gray-700 p-6 mb-8 shadow-xl">
    <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 flex items-center justify-center rounded-lg bg-gradient-to-r from-primary-500 to-primary-600">
            <i class="fas fa-plus text-white"></i>
        </div>
        <h2 class="text-2xl font-bold text-white">Create New Task</h2>
    </div>

    <form id="taskForm" onsubmit="createTask(event)" class="space-y-6">
        <!-- Basic Information -->
        <div class="glass rounded-lg p-6 border border-gray-700">
            <h3 class="text-lg font-semibold mb-4 text-white">
                <i class="fas fa-info-circle text-primary-500 mr-2"></i>
                Basic Information
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="task_name" class="block text-sm font-medium text-gray-300 mb-1">
                        Task Name
                    </label>
                    <input type="text" id="task_name" required placeholder="Enter task name">
                </div>
                <div>
                    <label for="generator_id" class="block text-sm font-medium text-gray-300 mb-1">
                        Generator
                    </label>
                    <select id="generator_id" required></select>
                </div>
				<div class="md:col-span-2">
					<label class="block text-sm font-medium text-gray-300 mb-1">
						Schedule
					</label>
					<div id="schedule-picker-root"></div>
				</div>
            </div>
        </div>

        <!-- Utilities -->
		<div class="glass rounded-lg p-6 border border-gray-700">
			<h3 class="text-lg font-semibold mb-4 text-white">
				<i class="fas fa-tools text-primary-500 mr-2"></i>
				Utilities (Drag to Reorder)
			</h3>
			<div id="utilities" class="space-y-2">
				<!-- Each utility will be added here dynamically -->
			</div>
			<div id="selected-utilities" class="mt-4 space-y-2">
				<!-- Selected utilities will move here -->
			</div>
		</div>

        <!-- Platforms -->
        <div class="glass rounded-lg p-6 border border-gray-700">
            <h3 class="text-lg font-semibold mb-4 text-white">
                <i class="fas fa-share-alt text-primary-500 mr-2"></i>
                Platforms
            </h3>
            <div id="platforms" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                <!-- Dynamically populated -->
            </div>
        </div>

        <!-- Advanced Options -->
        <div class="glass rounded-lg p-6 border border-gray-700">
            <h3 class="text-lg font-semibold mb-4 text-white">
                <i class="fas fa-cog text-primary-500 mr-2"></i>
                Advanced Options
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="hashtags" class="block text-sm font-medium text-gray-300 mb-1">
                        Hashtags
                    </label>
                    <input type="text" id="hashtags" placeholder="#example,#tags">
                </div>
                <div>
                    <label for="sound_name" class="block text-sm font-medium text-gray-300 mb-1">
                        Sound Name
                    </label>
                    <input type="text" id="sound_name" placeholder="Optional sound">
                </div>
                <div>
                    <label for="sound_volume" class="block text-sm font-medium text-gray-300 mb-1">
                        Sound Volume
                    </label>
                    <input type="text" id="sound_volume" placeholder="background">
                </div>
                <div>
                    <label for="email_notify" class="block text-sm font-medium text-gray-300 mb-1">
                        Notification Email
                    </label>
                    <input type="email" id="email_notify" placeholder="Optional notification email">
                </div>
            </div>
        </div>

        <button type="submit" class="w-full md:w-auto px-6 py-3 bg-gradient-to-r from-primary-500 to-primary-600 text-white rounded-lg font-semibold hover:from-primary-600 hover:to-primary-700 focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 focus:ring-offset-gray-900 transition-all">
            <i class="fas fa-plus-circle mr-2"></i>
            Create Task
        </button>
    </form>
</div>

<div class="bg-gray-800 rounded-xl border border-gray-700 p-6 mb-8 shadow-xl">
    <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 flex items-center justify-center rounded-lg bg-gradient-to-r from-primary-500 to-primary-600">
            <i class="fas fa-filter text-white"></i>
        </div>
        <h2 class="text-2xl font-bold text-white">Filter Tasks</h2>
    </div>

    <div class="space-y-6">
        <!-- Search -->
        <div class="flex gap-4">
            <div class="flex-1">
                <input type="text" 
                    id="task-search" 
                    placeholder="Search tasks..." 
                    class="w-full"
                    oninput="updateFilters()">
            </div>
        </div>

        <!-- Status Filters -->
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Status</label>
            <div id="status-filters" class="flex flex-wrap gap-2">
                <!-- Dynamically populated -->
            </div>
        </div>

        <!-- Platform Filters -->
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Platforms</label>
            <div id="platform-filters" class="flex flex-wrap gap-2">
                <!-- Dynamically populated -->
            </div>
        </div>

        <!-- Date Range -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label for="date-start" class="block text-sm font-medium text-gray-300 mb-2">Start Date</label>
                <input type="date" 
                    id="date-start" 
                    class="w-full"
                    onchange="updateFilters()">
            </div>
            <div>
                <label for="date-end" class="block text-sm font-medium text-gray-300 mb-2">End Date</label>
                <input type="date" 
                    id="date-end" 
                    class="w-full"
                    onchange="updateFilters()">
            </div>
        </div>
    </div>
</div>

<!-- Tasks Table -->
<div class="bg-gray-800 rounded-xl border border-gray-700 p-6 shadow-xl">
    <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 flex items-center justify-center rounded-lg bg-gradient-to-r from-primary-500 to-primary-600">
