    <style>
		/* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        
        ::-webkit-scrollbar-thumb {

        }
        
        ::-webkit-scrollbar-thumb:hover {

        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        }

        }

        /* Custom Focus Styles */

        }
		/* Form Controls */

			background-color: rgb(17, 24, 39) !important;
			border-color: rgb(55, 65, 81) !important;

			padding: 0.5rem 1rem !important;
			color: rgb(243, 244, 246) !important;

		}

		/* Style the select arrow */

			background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3E%3Cpath stroke='%23999' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3E%3C/svg%3E");
			background-position: right 0.5rem center;
			background-repeat: no-repeat;
			background-size: 1.5em 1.5em;
			padding-right: 2.5rem;
		}

		/* Fix checkbox and radio backgrounds */
		input[type="checkbox"],
		input[type="radio"] {
			background-color: rgb(17, 24, 39) !important;
			border-color: rgb(55, 65, 81) !important;
			color: #fc4828 !important;
		}

		/* Ensure placeholder text is visible but slightly dimmed */
		input::placeholder,
		textarea::placeholder,
		select::placeholder {
			color: rgb(156, 163, 175) !important;
		}

        /* Loading Shimmer Effect */
        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }

        .shimmer {
            animation: shimmer 2s infinite linear;
            background: linear-gradient(to right, #1a1a1a 4%, #333 25%, #1a1a1a 36%);
            background-size: 1000px 100%;
        }

        /* Tooltips */
        [data-tooltip] {
            position: relative;
        }

        [data-tooltip]:before {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            padding: 4px 8px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            font-size: 12px;
            border-radius: 4px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
        }

        [data-tooltip]:hover:before {
            opacity: 1;
            visibility: visible;
        }

		/* Toast Notifications */
        #toast-container {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            pointer-events: none;
        }

        .toast {
            display: flex;
            align-items: center;
            padding: 1rem;
            border-radius: 0.5rem;
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid rgba(75, 85, 99, 0.4);
            color: white;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);

            transform: translateX(100%) translateY(0);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            max-width: 24rem;
            margin-left: auto;
            pointer-events: auto;

            transform: translateX(0) translateY(0);

            transition: all 0.2s;

                opacity: 0;

                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }

        .toast-enter {
            animation: slideIn 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .toast-exit {
            animation: slideOut 0.2s cubic-bezier(0.68, -0.55, 0.265, 1.55);

        /* Status Indicators */

    <!-- Base Scripts -->
    <script>
	// Enhanced Toast Notification System
        function showToast(message, type = 'info') {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                document.body.appendChild(container);
            }

            const toast = document.createElement('div');
            toast.className = `toast toast-${type} toast-enter`;
            
            // Icon based on type
            const iconClass = type === 'error' ? 'fa-circle-xmark text-red-500' :
                            type === 'success' ? 'fa-circle-check text-green-500' :
                            'fa-circle-info text-blue-500';
            
            toast.innerHTML = `
                <i class="fas ${iconClass} toast-icon"></i>
                <div class="toast-content">${message}</div>
                <button class="toast-close" onclick="this.parentElement.remove()">
                    <i class="fas fa-times"></i>
                </button>
            `;
            
            container.appendChild(toast);
            
            // Force reflow to trigger animation
            toast.offsetHeight;
            toast.classList.add('show');

            const removeToast = () => {
                toast.classList.remove('show');
                toast.classList.add('toast-exit');
                setTimeout(() => {
                    if (toast.parentElement) {
                        toast.remove();
                    }
                    if (container.children.length === 0) {
                        container.remove();
                    }
                }, 200);
            };

            // Close automatically after 5 seconds
            setTimeout(removeToast, 5000);

            // Close on click anywhere on the toast
            toast.addEventListener('click', (e) => {
                if (!e.target.closest('.toast-close')) {
                    removeToast();
                }
            });
        }

        // Form validation helper
        function validateForm(formElement) {
            const requiredFields = formElement.querySelectorAll('[required]');
            let isValid = true;

            requiredFields.forEach(field => {
                if (!field.value.trim()) {
                    field.classList.add('border-red-500');
                    showToast(`${field.name || 'Field'} is required`, 'error');
                    isValid = false;
                } else {
                    field.classList.remove('border-red-500');
                }
            });

            return isValid;
        }

        // Add loading state to buttons
        function setButtonLoading(button, isLoading) {
            if (isLoading) {
                button.disabled = true;
                const originalContent = button.innerHTML;
                button.setAttribute('data-original-content', originalContent);
                button.innerHTML = `
                    <svg class="animate-spin h-5 w-5 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Loading...
                `;
            } else {
                button.disabled = false;
                const originalContent = button.getAttribute('data-original-content');
                if (originalContent) {
                    button.innerHTML = originalContent;
                }
            }
        }
    </script>
	<script type="text/javascript">
		// Schedule Picker Component
		const DaySchedulePicker = () => {
		  const { useState } = React;
		  const [schedule, setSchedule] = useState({
			sun: [],
			mon: [],
			tue: [],
			wed: [],
			thu: [],
			fri: [],
			sat: []
		  });

		  const days = [
			{ key: 'sun', label: 'Sunday' },
			{ key: 'mon', label: 'Monday' },
			{ key: 'tue', label: 'Tuesday' },
			{ key: 'wed', label: 'Wednesday' },
			{ key: 'thu', label: 'Thursday' },
			{ key: 'fri', label: 'Friday' },
			{ key: 'sat', label: 'Saturday' }
		  ];

		  // Generate hours in 12-hour format with AM/PM
		  const hours = Array.from({ length: 24 }, (_, i) => {
			const hour = i;
			const period = hour < 12 ? 'AM' : 'PM';
			const displayHour = hour === 0 ? 12 : hour > 12 ? hour - 12 : hour;
			const value = i.toString().padStart(2, '0');
			const label = `${displayHour}:00 ${period}`;
			return { value, label };
		  });

		  const minutes = Array.from({ length: 60 }, (_, i) => ({
			value: i.toString().padStart(2, '0'),
			label: i.toString().padStart(2, '0')
		  }));

		  const addTimeToDay = (day) => {
			const newSchedule = { ...schedule };
			newSchedule[day] = [...schedule[day], "12:00"];
			setSchedule(newSchedule);
			updateHiddenInput(newSchedule);
		  };

		  const removeTimeFromDay = (day, index) => {
			const newSchedule = { ...schedule };
			newSchedule[day] = schedule[day].filter((_, i) => i !== index);
			setSchedule(newSchedule);
			updateHiddenInput(newSchedule);
		  };

		  const updateTime = (day, index, hour, minute) => {
			const newSchedule = { ...schedule };
			newSchedule[day][index] = `${hour}:${minute}`;
			setSchedule(newSchedule);
			updateHiddenInput(newSchedule);
		  };

		  const updateHiddenInput = (newSchedule) => {
			const formatted = Object.entries(newSchedule)
			  .filter(([_, times]) => times.length > 0)
			  .map(([day, times]) => `${day}|${times.join(',')}`)
			  .join(';');

			const input = document.getElementById('schedule');
			if (input) input.value = formatted;
		  };

		  return React.createElement(
			'div',
			{ className: 'space-y-6' },
			days.map(({ key, label }) =>
			  React.createElement(
				'div',
				{
				  key,
				  className: 'p-4 bg-gray-800 rounded-lg border border-gray-700'
				},
				[
				  // Header with Label and Add Button
				  React.createElement(
					'div',
					{ 
					  key: 'header',
					  className: 'flex items-center justify-between mb-4' 
					},
					[
					  React.createElement('h3', { 
						className: 'text-lg font-medium text-white' 
					  }, label),
					  React.createElement(
						'button',
						{
						  type: 'button',
						  onClick: () => addTimeToDay(key),
						  className: 'inline-flex items-center px-3 py-1 text-sm bg-primary-500 hover:bg-primary-600 text-white rounded-lg transition-colors'
						},
						[
						  React.createElement('i', { 
							className: 'fas fa-plus mr-2' 
						  }),
						  'Add Time'
						]
					  )
					]
				  ),
				  // Time Slots Container
				  React.createElement(
					'div',
					{ 
					  key: 'slots',
					  className: 'space-y-3' 
					},
					schedule[key].length > 0 
					  ? schedule[key].map((time, index) => {
						  const [currentHour, currentMinute] = time.split(':');
						  return React.createElement(
							'div',
							{
							  key: index,
							  className: 'flex items-center space-x-2'
							},
							[
							  // Hour Select - Shows hour with AM/PM
							  React.createElement(
								'select',
								{
								  value: currentHour,
								  onChange: (e) => updateTime(key, index, e.target.value, currentMinute),
								  className: 'w-32'
								},
								hours.map(h =>
								  React.createElement(
									'option',
									{ key: h.value, value: h.value },
									h.label
								  )
								)
							  ),
							  // Minutes Select
							  React.createElement(
								'select',
								{
								  value: currentMinute,
								  onChange: (e) => updateTime(key, index, currentHour, e.target.value),
								  className: 'w-20'
								},
								minutes.map(m =>
								  React.createElement(
									'option',
									{ key: m.value, value: m.value },
									m.label
								  )
								)
							  ),
							  // Remove Button
							  React.createElement(
								'button',
								{
								  type: 'button',
								  onClick: () => removeTimeFromDay(key, index),
								  className: 'p-2 text-red-400 hover:text-red-300 transition-colors'
								},
								React.createElement('i', { className: 'fas fa-times' })
							  )
							]
						  );
						})
					  : React.createElement(
						  'div',
						  { className: 'text-gray-400 text-sm italic' },
						  'No times scheduled'
						)
				  )
				]
			  )
			),
			React.createElement('input', {
			  type: 'hidden',
			  id: 'schedule',
			  name: 'schedule',
			  required: true
			})
		  );
		};

		// Initialize when the page loads
		document.addEventListener('DOMContentLoaded', () => {
		  const container = document.getElementById('schedule-picker-root');
		  if (container) {
			ReactDOM.render(React.createElement(DaySchedulePicker), container);
		  }
		});
		</script>
		<script type="text/javascript">
			function formatJSON(json) {
				if (typeof json === 'string') {
					try {
						json = JSON.parse(json);
					} catch (e) {
						return json;
					}
				}
				return JSON.stringify(json, null, 2)
					.replace(/&/g, '&amp;')
					.replace(/</g, '&lt;')
					.replace(/>/g, '&gt;')
					.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
						let cls = 'text-blue-400';
						if (/^"/.test(match)) {
							if (/:$/.test(match)) {
								cls = 'text-gray-300';
							} else {
								cls = 'text-green-400';
							}
						} else if (/true|false/.test(match)) {
							cls = 'text-yellow-400';
						} else if (/null/.test(match)) {
							cls = 'text-red-400';
						}
						return '<span class="' + cls + '">' + match + '</span>';
					});
			}
