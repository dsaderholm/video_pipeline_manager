{% extends "base.html" %}

{% block head %}
<script>
    // Log viewer component
    function LogViewer() {
        const [logs, setLogs] = React.useState([]);
        const [loading, setLoading] = React.useState(true);
        const [filter, setFilter] = React.useState({
            level: '',
            taskId: '',
            since: ''
        });
        const [autoRefresh, setAutoRefresh] = React.useState(true);
        const [expandedLogs, setExpandedLogs] = React.useState(new Set());

        // Color mapping for log levels
        const levelColors = {
            'DEBUG': 'text-blue-400',
            'INFO': 'text-green-400',
            'WARNING': 'text-yellow-400',
            'ERROR': 'text-red-400',
            'CRITICAL': 'text-red-600'
        };

        // Background colors for expanded view
        const expandedBgColors = {
            'DEBUG': 'bg-blue-900/20',
            'INFO': 'bg-green-900/20',
            'WARNING': 'bg-yellow-900/20',
            'ERROR': 'bg-red-900/20',
            'CRITICAL': 'bg-red-900/30'
        };

        // Fetch logs with current filters
        const fetchLogs = async () => {
            try {
                const params = new URLSearchParams({
                    limit: 100,
                    ...filter
                });
                const response = await fetch(`/api/logs?${params}`);
                const data = await response.json();
                setLogs(data.logs);
            } catch (error) {
                console.error('Failed to fetch logs:', error);
                showToast('Failed to fetch logs', 'error');
            } finally {
                setLoading(false);
            }
        };

        // Set up auto-refresh
        React.useEffect(() => {
            if (autoRefresh) {
                const interval = setInterval(fetchLogs, 5000);
                return () => clearInterval(interval);
            }
        }, [autoRefresh, filter]);

        // Initial fetch
        React.useEffect(() => {
            fetchLogs();
        }, [filter]);

        // Toggle expanded view for a log
        const toggleExpanded = (logId) => {
            setExpandedLogs(prev => {
                const next = new Set(prev);
                if (next.has(logId)) {
                    next.delete(logId);
                } else {
                    next.add(logId);
                }
                return next;
            });
        };

        // Format the details section
        const formatDetails = (details) => {
            if (!details) return null;
            try {
                return JSON.stringify(details, null, 2);
            } catch {
                return details;
            }
        };

        return React.createElement(
            'div',
            { className: 'space-y-4' },
            // Controls section
            React.createElement('div', { className: 'flex items-center space-x-4 mb-4' },
                React.createElement('select', {
                    value: filter.level,
                    onChange: (e) => setFilter({ ...filter, level: e.target.value }),
                    className: 'bg-gray-800 text-white px-3 py-2 rounded-lg border border-gray-700'
                }, [
                    React.createElement('option', { value: '' }, 'All Levels'),
                    ...Object.keys(levelColors).map(level =>
                        React.createElement('option', { value: level, key: level }, level)
                    )
                ]),
                React.createElement('input', {
                    type: 'text',
                    placeholder: 'Task ID',
                    value: filter.taskId,
                    onChange: (e) => setFilter({ ...filter, taskId: e.target.value }),
                    className: 'bg-gray-800 text-white px-3 py-2 rounded-lg border border-gray-700'
                }),
                React.createElement('label', { className: 'flex items-center space-x-2 text-gray-300' },
                    React.createElement('input', {
                        type: 'checkbox',
                        checked: autoRefresh,
                        onChange: (e) => setAutoRefresh(e.target.checked),
                        className: 'form-checkbox h-4 w-4 text-primary-500 rounded border-gray-700 bg-gray-800'
                    }),
                    'Auto-refresh'
                ),
                React.createElement('button', {
                    onClick: fetchLogs,
                    className: 'px-4 py-2 bg-primary-500 hover:bg-primary-600 text-white rounded-lg transition-colors'
                }, 'Refresh')
            ),

            // Logs table
            React.createElement('div', { className: 'bg-gray-800 rounded-lg overflow-hidden' },
                React.createElement('table', { className: 'min-w-full divide-y divide-gray-700' },
                    React.createElement('thead', { className: 'bg-gray-900' },
                        React.createElement('tr', null,
                            React.createElement('th', { className: 'px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider' }, 'Timestamp'),
                            React.createElement('th', { className: 'px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider' }, 'Level'),
                            React.createElement('th', { className: 'px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider' }, 'Message'),
                            React.createElement('th', { className: 'px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider' }, 'Task'),
                            React.createElement('th', { className: 'px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider' }, 'Actions')
                        )
                    ),
                    React.createElement('tbody', { className: 'divide-y divide-gray-700' },
                        logs.map(log => [
                            React.createElement('tr', {
                                key: log.id,
                                className: 'hover:bg-gray-700 transition-colors cursor-pointer',
                                onClick: () => toggleExpanded(log.id)
                            },
                                React.createElement('td', { className: 'px-6 py-4 whitespace-nowrap text-sm text-gray-300' }, log.timestamp),
                                React.createElement('td', { className: `px-6 py-4 whitespace-nowrap text-sm ${levelColors[log.level]}` }, log.level),
                                React.createElement('td', { className: 'px-6 py-4 text-sm text-gray-300' }, log.message),
                                React.createElement('td', { className: 'px-6 py-4 whitespace-nowrap text-sm text-gray-300' },
                                    log.task_id ? React.createElement('a', {
                                        href: `/tasks/${log.task_id}`,
                                        className: 'text-primary-500 hover:text-primary-400',
                                        onClick: (e) => e.stopPropagation()
                                    }, `Task ${log.task_id}`) : '-'
                                ),
                                React.createElement('td', { className: 'px-6 py-4 whitespace-nowrap text-sm text-gray-300' },
                                    React.createElement('button', {
                                        className: 'text-gray-400 hover:text-gray-300',
                                        onClick: (e) => {
                                            e.stopPropagation();
                                            toggleExpanded(log.id);
                                        }
                                    },
                                        React.createElement('i', {
                                            className: `fas fa-chevron-${expandedLogs.has(log.id) ? 'up' : 'down'}`
                                        })
                                    )
                                )
                            ),
                            // Expanded details row
                            expandedLogs.has(log.id) && React.createElement('tr', { key: `${log.id}-details` },
                                React.createElement('td', { 
                                    colSpan: 5, 
                                    className: `px-6 py-4 ${expandedBgColors[log.level] || 'bg-gray-800/50'}`
                                },
                                    React.createElement('div', { className: 'space-y-2' },
                                        log.source && React.createElement('div', { className: 'text-sm' },
                                            React.createElement('span', { className: 'text-gray-400' }, 'Source: '),
                                            React.createElement('span', { className: 'text-gray-300' }, log.source)
                                        ),
                                        log.details && React.createElement('pre', {
                                            className: 'text-sm text-gray-300 bg-gray-900/50 p-3 rounded-lg overflow-x-auto'
                                        }, formatDetails(log.details))
                                    )
                                )
                            )
                        ].filter(Boolean))
                    )
                )
            ),

            // Loading state
            loading && React.createElement('div', { className: 'flex justify-center py-4' },
                React.createElement('div', { className: 'animate-spin rounded-full h-8 w-8 border-b-2 border-primary-500' })
            )
        );
    }

    // Initialize when the page loads
    document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('log-viewer-root');
        if (container) {
            ReactDOM.render(React.createElement(LogViewer), container);
        }
    });
</script>
{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="flex justify-between items-center">
        <h1 class="text-2xl font-bold gradient-text">System Logs</h1>
    </div>
    
    <div id="log-viewer-root"></div>
</div>
{% endblock %}
